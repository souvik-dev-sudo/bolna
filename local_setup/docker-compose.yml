services:

  # main bolna service
  bolna-app:
    build:
      context: ..
      dockerfile: local_setup/dockerfiles/bolna_server.Dockerfile
    image: bolna-app:latest  # This will tag the built image
    ports:
      - "5001:5001"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - ../agent_data:/app/agent_data
      - $HOME/.aws/credentials:/root/.aws/credentials:ro
      - $HOME/.aws/config:/root/.aws/config:ro

  # redis service used as a persistent storage
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  # Postgres: app data such as call history (agents stay in Redis for now).
  # bolna-app does not depend on it: it connects on first use, so the stack runs without it.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bolna}
    ports:
      - "127.0.0.1:5432:5432"  # host access for local tools only, never public
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ngrok for local tunneling
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok-config.yml:/etc/ngrok.yml
    ports:
      - 4040:4040

  ### Telephony servers ###
  twilio-app:
    build:
      context: .
      dockerfile: dockerfiles/twilio_server.Dockerfile
    image: twilio-app:latest  # This will tag the built image
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - ngrok
      - bolna-app
    env_file:
      - .env

  plivo-app:
    build:
      context: .
      dockerfile: dockerfiles/plivo_server.Dockerfile
    image: plivo-app:latest  # This will tag the built image
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - ngrok
      - bolna-app
    env_file:
      - .env

  # Frontend dev server (Vite) with hot reload on http://localhost:5173.
  # Development only: starts only when named (`docker compose up -d frontend`).
  # node_modules stays in a Docker volume, off the slow NTFS bind mount.
  frontend:
    image: node:22-alpine
    profiles: ["frontend"]
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      BOLNA_API_URL: http://bolna-app:5001
      TELEPHONY_API_URL: http://plivo-app:8002
      VITE_USE_POLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  # nginx reverse proxy: routes the single ngrok URL by path
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bolna-app
      - plivo-app

volumes:
  pgdata:
  frontend_node_modules:
