events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Bolna websocket stream (/chat/v1/{agent_id})
        location /chat/ {
            proxy_pass http://bolna-app:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Plivo telephony server (/call, /plivo_connect, /plivo_hangup_callback)
        location / {
            proxy_pass http://plivo-app:8002;
            proxy_set_header Host $host;
        }
    }
}
